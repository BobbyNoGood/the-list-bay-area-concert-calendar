.eventbtn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

const venueUrls={"Fox Theater": "https://thefoxoakland.com/", "Great American Music Hall": "https://gamh.com/", "4 Star Theater": "https://www.4-star-movies.com/", "Bottom of the Hill": "http://www.bottomofthehill.com/", "Brick and Mortar": "https://www.brickandmortarmusic.com/", "Jury Room": "https://juryroom.com/", "Knockout": "https://theknockoutsf.com/", "Rickshaw Stop": "https://rickshawstop.com/", "San Jose Civic": "https://sanjosetheaters.org/theaters/san-jose-civic/", "Warfield": "https://www.thewarfieldtheatre.com/", "Above DNA Lounge": "https://www.dnalounge.com/", "DNA Lounge": "https://www.dnalounge.com/", "Arlene Francis Center": "https://arlenefranciscenter.org/", "Black Cat": "https://blackcatsf.com/", "Crepe Place": "https://thecrepeplace.com/", "Greek Theater": "https://thegreekberkeley.com/", "Gundlach Bundschu Winery": "https://www.gunbun.com/", "Independent": "https://theindependentsf.com/", "Ivy Room": "https://ivyroom.com/", "Kuumbwa Jazz Center": "https://www.kuumbwajazz.org/", "Masonic": "https://www.livenation.com/venue/KovZpZAJ6nlA/the-masonic-events", "Shoreline Amphitheater": "https://www.livenation.com/venue/KovZpZA6ta1A/shoreline-amphitheatre-events", "Thee Stork Club": "https://theestorkclub.com/", "August Hall": "https://www.augusthallsf.com/", "Cafe Du Nord": "https://cafedunord.com/", "Castro Theater": "https://www.castrotheatre.com/", "Castro": "https://www.castrotheatre.com/", "Chapel": "https://thechapelsf.com/", "Civic Auditorium": "https://billgrahamcivic.com/", "Eagle": "https://sf-eagle.com/", "Kilowatt": "https://kilowattbar.com/", "Sebastiani Theater": "https://sebastianitheatre.com/", "Winters Tavern": "https://winterstavern.com/", "Bimbo's 365 Club": "https://bimbos365club.com/", "Felton Music Hall": "https://feltonmusichall.com/", "Hopmonk Tavern": "https://kcturnerpresents.com/hopmonk-novato/", "Hotel Utah": "https://hotelutah.com/", "Meritage Resort": "https://www.meritageresort.com/", "Phoenix Theater": "https://www.thephoenixtheater.com/", "Swedish American Hall": "https://www.swedishamericanhall.com/", "924 Gilman Street": "https://www.924gilman.org/", "Caravan Lounge": "https://www.caravanloungesanjose.com/", "Eli's Mile High Club": "https://elismilehigh.com/", "Frost Amphitheater": "https://live.stanford.edu/your-visit/venues/frost-amphitheater/", "Mountain Winery": "https://www.mountainwinery.com/", "Stern Grove Festival": "https://www.sterngrove.org/", "Thrillhouse Records": "https://thrillhouserecords.com/", "Amoeba Music": "https://www.amoeba.com/", "Faction Brewing": "https://www.factionbrewing.com/", "Oakland Pride": "https://www.oaklandpride.org/", "Presidio Theater": "https://www.presidiotheatre.org/", "Spats": "https://spatsberkeley.com/"};

const q=document.getElementById('q');
const date=document.getElementById('date');
const city=document.getElementById('city');
const venue=document.getElementById('venue');
const chips=document.getElementById('chips');
const root=document.getElementById('root');

const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

[...new Set(events.map(e=>e.city).filter(Boolean))].sort().forEach(x=>city.add(new Option(x,x)));
[...new Set(events.map(e=>e.venue).filter(Boolean))].sort().forEach(x=>venue.add(new Option(x,x)));

const uniqueDates=[...new Map(events.map(e=>[e.date,{date:e.date,day:e.day}])).values()].sort((a,b)=>a.date.localeCompare(b.date));

const all=document.createElement('button');
all.className='chip active';
all.textContent='All week';
all.dataset.date='';
all.onclick=()=>setDate('');
chips.appendChild(all);

uniqueDates.forEach(d=>{
  const b=document.createElement('button');
  b.className='chip';
  b.textContent=d.day;
  b.dataset.date=d.date;
  b.onclick=()=>setDate(d.date);
  chips.appendChild(b);
});

function setDate(value){
  date.value=value;
  render();
}

function eventUrl(e){
  const official = venueUrls[e.venue];
  return official || '';
}

function render(){
  const qs=q.value.trim().toLowerCase();
  const dv=date.value,cv=city.value,vv=venue.value;
  const f=events.filter(e=>{
    const search=[e.day,e.venue,e.city,e.artists,e.details].join(' ').toLowerCase();
    return (!qs||search.includes(qs))&&(!dv||e.date===dv)&&(!cv||e.city===cv)&&(!vv||e.venue===vv);
  });

  document.getElementById('showCount').textContent=f.length;
  document.getElementById('venueCount').textContent=new Set(f.map(e=>e.venue)).size;
  document.getElementById('cityCount').textContent=new Set(f.map(e=>e.city).filter(Boolean)).size;
  document.getElementById('dateStat').textContent=dv?new Date(dv+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'All';

  [...chips.children].forEach(b=>b.classList.toggle('active',b.dataset.date===dv));

  root.innerHTML='';
  for(const d of uniqueDates){
    const list=f.filter(e=>e.date===d.date);
    if(!list.length) continue;
    const sec=document.createElement('section');
    sec.className='day';
    sec.innerHTML=`<div class="dayhead"><h2>${esc(d.day)}</h2><span>${list.length} show${list.length===1?'':'s'}</span></div>`;
    list.forEach(e=>{
      const url=eventUrl(e);
      sec.insertAdjacentHTML('beforeend',`
        <article class="show">
          <div>
            <div class="venue">${esc(e.venue)}</div>
            <div class="city">${esc(e.city)}</div>
          </div>
          <div>
            <div class="artists">${esc(e.artists)}</div>
            <div class="details">${esc(e.details)}</div>
          </div>
          ${url
            ? `<a class="eventbtn" href="${esc(url)}" target="_blank" rel="noopener">Official venue ↗</a>`
            : `<span class="eventbtn secondary">No verified link</span>`}
        </article>`);
    });
    root.appendChild(sec);
  }

  if(!f.length) root.innerHTML='<div class="empty">No shows match those filters.</div>';
}

[q,date,city,venue].forEach(el=>el.addEventListener(el===q?'input':'change',render));
document.getElementById('clear').onclick=()=>{q.value='';date.value='';city.value='';venue.value='';render();};
render();
</script>
