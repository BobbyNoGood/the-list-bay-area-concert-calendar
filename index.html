<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bay Area Concert Calendar</title><style>:root{--bg:#0b0d10;--panel:#15191f;--panel2:#1d232b;--line:#303844;--text:#f5f7fa;--muted:#9aa3ae;--lime:#d7ff3f;--pink:#ff4f87;--red:#ff718d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}h1{margin:0;font-size:30px}.muted{color:var(--muted)}button,input,select{font:inherit}button{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;font-weight:800}button.primary{background:var(--lime);color:#111;border-color:var(--lime)}.status{padding:12px 14px;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.status.ok{color:var(--lime)}.status.error{color:var(--red)}.controls{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr auto;gap:10px;margin:18px 0}input,select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);width:100%}.daychips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:9px 11px;border-radius:999px}.chip.active{background:var(--pink);border-color:var(--pink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.day{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);margin:14px 0}.dayhead{display:flex;justify-content:space-between;padding:13px 16px;background:var(--panel2)}.dayhead h2{font-size:17px;margin:0}.show{display:grid;grid-template-columns:minmax(200px,1fr) 2.4fr auto;gap:15px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}.show.clickable{cursor:pointer}.show.clickable:hover{background:#20262e}.venue{font-weight:850}.city,.details{color:var(--muted);font-size:13px;margin-top:4px}.artists{line-height:1.45}.openCue{color:var(--lime);font-size:12px;font-weight:900;white-space:nowrap}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@media(max-width:900px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.show{grid-template-columns:1fr}.openCue{white-space:normal}}</style></head><body><div class="wrap"><header><div><h1>Bay Area Concert Calendar</h1><div class="muted" id="weekLabel">Loading current week…</div></div><button id="refresh">Refresh</button></header><div id="status" class="status">Loading saved listings…</div><div class="controls"><input id="q" placeholder="Search artist, venue, city, price or time"><input id="date" type="date"><select id="city"><option value="">All cities</option></select><select id="venue"><option value="">All venues</option></select><button id="clear" class="primary">Clear filters</button></div><div class="daychips" id="chips"></div><div class="stats"><div class="stat"><small>Matching shows</small><strong id="showCount">0</strong></div><div class="stat"><small>Venues</small><strong id="venueCount">0</strong></div><div class="stat"><small>Cities</small><strong id="cityCount">0</strong></div><div class="stat"><small>Date</small><strong id="dateStat">All</strong></div></div><div id="root"></div></div><script>
const VENUE_URLS={"924 Gilman Street":"https://www.924gilman.org/","August Hall":"https://www.augusthallsf.com/","Bimbo's 365 Club":"https://bimbos365club.com/","Bottom of the Hill":"https://www.bottomofthehill.com/","Brick and Mortar":"https://www.brickandmortarmusic.com/","Cafe Du Nord":"https://cafedunord.com/","Chapel":"https://thechapelsf.com/","Chase Center":"https://www.chasecenter.com/","Davies Symphony Hall":"https://www.sfsymphony.org/","DNA Lounge":"https://www.dnalounge.com/","Fillmore":"https://www.livenation.com/venue/KovZpZA6ta6A/the-fillmore-events","Fox Theater":"https://thefoxoakland.com/","Frost Amphitheater":"https://live.stanford.edu/venues/frost-amphitheater","Great American Music Hall":"https://gamh.com/","Greek Theater":"https://thegreekberkeley.com/","Independent":"https://theindependentsf.com/","Ivy Room":"https://ivyroom.com/","Kilowatt":"https://kilowattbar.com/","Mountain Winery":"https://www.mountainwinery.com/","Phoenix Theater":"https://www.thephoenixtheater.com/","Regency Ballroom":"https://www.theregencyballroom.com/","Rickshaw Stop":"https://rickshawstop.com/","Ritz":"https://theritzsanjose.com/","San Jose Civic":"https://sanjosetheaters.org/theaters/san-jose-civic/","Shoreline Amphitheater":"https://www.livenation.com/venue/KovZpZA6ta1A/shoreline-amphitheatre-events","Sweetwater Music Hall":"https://sweetwatermusichall.com/","Swedish American Hall":"https://swedishamericanhall.com/","Thee Stork Club":"https://theestorkclub.com/","Warfield":"https://www.thewarfieldtheatre.com/"};let events=[],meta={};const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));function venueURL(name){const n=(name||"").toLowerCase();for(const[k,u]of Object.entries(VENUE_URLS))if(n.includes(k.toLowerCase()))return u;return""}async function load(){$("status").className="status";$("status").textContent="Loading saved listings…";try{const r=await fetch("events.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();events=data.events||[];meta=data.meta||{};if(!events.length)throw Error("No listings in events.json");$("weekLabel").textContent=meta.week_label||"Current week";$("status").className="status ok";$("status").textContent=`${events.length} shows loaded · updated ${meta.updated_at||""}`;init()}catch(e){$("status").className="status error";$("status").textContent="Saved show data could not be loaded.";$("root").innerHTML='<div class="empty">The automatic updater has not produced events.json yet.</div>'}}function init(){$("city").innerHTML='<option value="">All cities</option>';$("venue").innerHTML='<option value="">All venues</option>';$("chips").innerHTML="";[...new Set(events.map(e=>e.city).filter(Boolean))].sort().forEach(x=>$("city").add(new Option(x,x)));[...new Set(events.map(e=>e.venue).filter(Boolean))].sort().forEach(x=>$("venue").add(new Option(x,x)));const dates=[...new Map(events.map(e=>[e.date,e.day])).entries()].sort();const all=document.createElement("button");all.className="chip active";all.textContent="All week";all.dataset.date="";all.onclick=()=>setDate("");$("chips").appendChild(all);dates.forEach(([d,label])=>{const b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.date=d;b.onclick=()=>setDate(d);$("chips").appendChild(b)});if(dates.length){$("date").min=dates[0][0];$("date").max=dates[dates.length-1][0]}render()}function setDate(d){$("date").value=d;render()}function render(){const qs=$("q").value.toLowerCase(),dv=$("date").value,cv=$("city").value,vv=$("venue").value;const f=events.filter(e=>(!qs||JSON.stringify(e).toLowerCase().includes(qs))&&(!dv||e.date===dv)&&(!cv||e.city===cv)&&(!vv||e.venue===vv));$("showCount").textContent=f.length;$("venueCount").textContent=new Set(f.map(e=>e.venue)).size;$("cityCount").textContent=new Set(f.map(e=>e.city).filter(Boolean)).size;$("dateStat").textContent=dv?new Date(dv+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"All";[...$("chips").children].forEach(b=>b.classList.toggle("active",b.dataset.date===dv));$("root").innerHTML="";const groups=new Map();f.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{if(!groups.has(e.date))groups.set(e.date,[]);groups.get(e.date).push(e)});for(const[,list]of groups){const sec=document.createElement("section");sec.className="day";sec.innerHTML=`<div class="dayhead"><h2>${esc(list[0].day)}</h2><span>${list.length} show${list.length===1?"":"s"}</span></div>`;list.forEach(e=>{const u=venueURL(e.venue),a=document.createElement("article");a.className="show"+(u?" clickable":"");if(u)a.onclick=()=>location.href=u;a.innerHTML=`<div><div class="venue">${esc(e.venue)}</div><div class="city">${esc(e.city)}</div></div><div><div class="artists">${esc(e.artists)}</div><div class="details">${esc(e.details)}</div></div><div class="openCue">${u?"Official venue ↗":""}</div>`;sec.appendChild(a)});$("root").appendChild(sec)}if(!f.length)$("root").innerHTML='<div class="empty">No shows match those filters.</div>'}["q","date"].forEach(x=>$(x).addEventListener("input",render));["city","venue"].forEach(x=>$(x).addEventListener("change",render));$("clear").onclick=()=>{$("q").value="";$("date").value="";$("city").value="";$("venue").value="";render()};$("refresh").onclick=load;load();
</script></body></html>
