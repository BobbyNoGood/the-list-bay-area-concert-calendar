<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bay Area Concert Calendar</title>
<style>
:root{--bg:#0b0d10;--panel:#15191f;--panel2:#1d232b;--line:#303844;--text:#f5f7fa;--muted:#9aa3ae;--lime:#d7ff3f;--pink:#ff4f87}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:22px}h1{margin:0;font-size:30px}.muted{color:var(--muted)}
.controls{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr auto;gap:10px;margin:18px 0}
input,select,button{font:inherit}input,select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}
button{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;font-weight:800}
button.primary{background:var(--lime);color:#111;border-color:var(--lime)}
.daychips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:9px 11px;border-radius:999px}.chip.active{background:var(--pink);border-color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}
.day{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);margin:14px 0}.dayhead{display:flex;justify-content:space-between;padding:13px 16px;background:var(--panel2)}.dayhead h2{font-size:17px;margin:0}
.show{display:grid;grid-template-columns:minmax(190px,1fr) 2.2fr;gap:15px;padding:14px 16px;border-top:1px solid var(--line)}.show.linked{cursor:pointer}.show.linked:hover{background:#20262e}
.venue{font-weight:850}.city,.details{color:var(--muted);font-size:13px;margin-top:4px}.artists{line-height:1.45}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media(max-width:900px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.show{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Bay Area Concert Calendar</h1>
<div class="muted" id="statusText">Fetching Foopee listings for Aug 17–23, 2026…</div>
<div class="controls">
<input id="q" placeholder="Search artist, venue, city, price or time">
<input id="date" type="date" min="2026-08-17" max="2026-08-23">
<select id="city"><option value="">All cities</option></select>
<select id="venue"><option value="">All venues</option></select>
<button id="clear" class="primary">Clear filters</button>
</div>
<div class="daychips" id="chips"></div>
<div class="stats">
<div class="stat"><small>Matching shows</small><strong id="showCount">0</strong></div>
<div class="stat"><small>Venues</small><strong id="venueCount">0</strong></div>
<div class="stat"><small>Cities</small><strong id="cityCount">0</strong></div>
<div class="stat"><small>Date filter</small><strong id="dateStat">All</strong></div>
</div>
<div id="root"><div class="empty">Loading current listings…</div></div>
</div>
<script>
const VENUES={
"The Chapel":"https://thechapelsf.com/","Chapel":"https://thechapelsf.com/",
"Bottom of the Hill":"https://bottomofthehill.com/","924 Gilman Street":"https://www.924gilman.org/",
"The Warfield":"https://www.thewarfieldtheatre.com/","Warfield":"https://www.thewarfieldtheatre.com/",
"The Independent":"https://theindependentsf.com/","Rickshaw Stop":"https://rickshawstop.com/",
"Great American Music Hall":"https://gamh.com/","Ivy Room":"https://ivyroom.com/","Kilowatt":"https://kilowattbar.com/",
"Thee Stork Club":"https://theestorkclub.com/","Fox Theater":"https://thefoxoakland.com/",
"August Hall":"https://augusthallsf.com/","Cafe Du Nord":"https://cafedunord.com/","DNA Lounge":"https://www.dnalounge.com/",
"Mountain Winery":"https://www.mountainwinery.com/","Greek Theater":"https://thegreekberkeley.com/",
"Frost Amphitheater":"https://live.stanford.edu/venues/frost-amphitheater","Guild Theatre":"https://guildtheatre.com/",
"SAP Center":"https://www.sapcenter.com/","Levi's Stadium":"https://www.levisstadium.com/","49'ers Stadium":"https://www.levisstadium.com/",
"Chase Center":"https://www.chasecenter.com/","Yoshi's":"https://yoshis.com/","San Jose Civic":"https://sanjosetheaters.org/theaters/san-jose-civic/",
"The Ritz":"https://theritzsanjose.com/","Felton Music Hall":"https://www.feltonmusichall.com/","Phoenix Theater":"https://www.thephoenixtheater.com/",
"Kuumbwa Jazz Center":"https://www.kuumbwajazz.org/","Bimbo's 365 Club":"https://bimbos365club.com/","Swedish American Hall":"https://swedishamericanhall.com/",
"Hotel Utah":"https://hotelutah.com/","Black Cat":"https://blackcatsf.com/"
};
let events=[],days=[];
const $=x=>document.getElementById(x),esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function venueURL(v){let x=(v||"").toLowerCase();for(const [k,u] of Object.entries(VENUES))if(x.includes(k.toLowerCase()))return u;return""}
function parse(text){
 const doc=new DOMParser().parseFromString(text,"text/html"),out=[];let currentDate="",currentDay="";
 doc.body.querySelectorAll("a[name],li").forEach(node=>{
  if(node.tagName==="A"){const n=node.getAttribute("name");if(n&&/^\d{8}$/.test(n)){currentDate=`${n.slice(0,4)}-${n.slice(4,6)}-${n.slice(6,8)}`;currentDay=node.parentNode?.textContent.trim()||currentDate}}
  else if(currentDate&&currentDate>="2026-08-17"&&currentDate<="2026-08-23"){
   const raw=node.textContent.trim();if(!raw)return;let venue="Unknown Venue",city="",artists=raw,details="";
   const a=node.querySelector('a[href*="by-club"]');if(a)venue=a.textContent.trim();
   const i=raw.indexOf(":");if(i>=0){const left=raw.slice(0,i),right=raw.slice(i+1);if(!a)venue=left.split(",")[0].trim();if(left.includes(","))city=left.split(",").slice(1).join(",").trim();artists=right.trim()}
   const p=artists.match(/\(([^)]+)\)$/);if(p){details=p[1];artists=artists.replace(/\(([^)]+)\)$/,"").trim()}
   out.push({date:currentDate,day:currentDay,venue,city,artists,details});
  }
 });return out
}
async function load(){
 const target="http://www.foopee.com/punk/the-list/by-date.1.html";
 const routes=["https://api.allorigins.win/raw?url="+encodeURIComponent(target),"https://r.jina.ai/http://www.foopee.com/punk/the-list/by-date.1.html"];
 for(const url of routes){try{const r=await fetch(url);if(!r.ok)continue;const t=await r.text();const e=parse(t);if(e.length){events=e;init();$("statusText").textContent=`${e.length} current Foopee listings loaded for Aug 17–23, 2026`;return}}catch(e){}}
 $("statusText").textContent="Foopee could not be reached right now. Refresh this page to retry.";
 $("root").innerHTML='<div class="empty">Live listings could not be loaded. Refresh to try again.</div>';
}
function init(){
 $("city").innerHTML='<option value="">All cities</option>';$("venue").innerHTML='<option value="">All venues</option>';
 [...new Set(events.map(e=>e.city).filter(Boolean))].sort().forEach(x=>$("city").add(new Option(x,x)));
 [...new Set(events.map(e=>e.venue).filter(Boolean))].sort().forEach(x=>$("venue").add(new Option(x,x)));
 days=[...new Set(events.map(e=>e.day))];$("chips").innerHTML='<button class="chip active" onclick="setDate(\'\')">All week</button>';
 days.forEach(d=>{let e=events.find(x=>x.day===d),b=document.createElement("button");b.className="chip";b.textContent=d;b.dataset.date=e.date;b.onclick=()=>setDate(e.date);$("chips").appendChild(b)});render()
}
function setDate(d){$("date").value=d;render()}
function render(){
 const qs=$("q").value.toLowerCase(),dv=$("date").value,cv=$("city").value,vv=$("venue").value;
 const f=events.filter(e=>(!qs||JSON.stringify(e).toLowerCase().includes(qs))&&(!dv||e.date===dv)&&(!cv||e.city===cv)&&(!vv||e.venue===vv));
 $("showCount").textContent=f.length;$("venueCount").textContent=new Set(f.map(e=>e.venue)).size;$("cityCount").textContent=new Set(f.map(e=>e.city).filter(Boolean)).size;$("dateStat").textContent=dv||"All";
 $("root").innerHTML="";
 days.forEach(d=>{const list=f.filter(e=>e.day===d);if(!list.length)return;const sec=document.createElement("section");sec.className="day";sec.innerHTML=`<div class="dayhead"><h2>${esc(d)}</h2><span>${list.length} show${list.length===1?"":"s"}</span></div>`;
 list.forEach(e=>{const u=venueURL(e.venue),a=document.createElement("article");a.className="show"+(u?" linked":"");if(u)a.onclick=()=>location.href=u;a.innerHTML=`<div><div class="venue">${esc(e.venue)}</div><div class="city">${esc(e.city)}</div></div><div><div class="artists">${esc(e.artists)}</div><div class="details">${esc(e.details)}</div></div>`;sec.appendChild(a)});$("root").appendChild(sec)});
 if(!f.length)$("root").innerHTML='<div class="empty">No shows match those filters.</div>'
}
["q","date"].forEach(x=>$(x).addEventListener("input",render));["city","venue"].forEach(x=>$(x).addEventListener("change",render));
$("clear").onclick=()=>{$("q").value="";$("date").value="";$("city").value="";$("venue").value="";render()};load();
</script></body></html>
