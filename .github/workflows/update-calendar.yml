name: Update Foopee concert calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"
    - cron: "0 17 * * 1"

permissions:
  contents: write

concurrency:
  group: foopee-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Pacific time
        id: pacific
        run: |
          HOUR=$(TZ=America/Los_Angeles date +%H)
          DAY=$(TZ=America/Los_Angeles date +%u)
          if [ "$HOUR" = "09" ] && [ "$DAY" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.pacific.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update calendar
        if: steps.pacific.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python update_calendar.py

      - name: Commit updated events
        if: steps.pacific.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Foopee concert calendar"
            git push
          fi
